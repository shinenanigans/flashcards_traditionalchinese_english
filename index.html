<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>飲食 Food Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#E9F0EC; --surface:#FBFDFB; --ink:#16241F; --muted:#5B6E66; --line:#C9D8D0;
  --tile:#2F6B5E; --accent:#B8322A; --accent-ink:#FFFFFF; --good:#2E7D4F; --again:#B8322A;
  --card-back:#1F4A41; --card-back-ink:#F1F7F3; --chip:#DCE8E2;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Instrument Sans","Noto Sans TC",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101815; --surface:#18231F; --ink:#E6EFEA; --muted:#93A69E; --line:#2A3A34;
    --tile:#5FA893; --accent:#E2574C; --accent-ink:#1A0B09; --good:#5FBF86; --again:#E2574C;
    --card-back:#234F45; --card-back-ink:#EEF6F1; --chip:#22302B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101815; --surface:#18231F; --ink:#E6EFEA; --muted:#93A69E; --line:#2A3A34;
  --tile:#5FA893; --accent:#E2574C; --accent-ink:#1A0B09; --good:#5FBF86; --again:#E2574C;
  --card-back:#234F45; --card-back-ink:#EEF6F1; --chip:#22302B;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.5;
  padding:24px 16px 48px;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:28px 28px; background-position:-1px -1px;
}
.wrap{max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:20px}
header{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:12px}
h1{margin:0; font-family:var(--serif); font-weight:900; font-size:clamp(28px,6vw,40px); line-height:1.1; text-wrap:balance}
h1 small{display:block; font-family:var(--sans); font-weight:500; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-top:6px}
.score{font-family:var(--mono); font-size:13px; color:var(--muted); display:flex; gap:14px; font-variant-numeric:tabular-nums}
.score b{font-weight:500}
.score .k{color:var(--good)} .score .a{color:var(--again)}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:12px}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.row .lbl{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); width:88px; flex-shrink:0}
.chip{
  font:inherit; font-size:13px; border:1px solid var(--line); background:var(--chip); color:var(--ink);
  padding:5px 11px; border-radius:999px; cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--tile); border-color:var(--tile); color:var(--surface)}
.chip:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.stage{perspective:1400px}
.card{
  position:relative; width:100%; aspect-ratio:3/2; max-width:100%; min-height:260px;
  cursor:pointer; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.3,.7,.3,1);
  border:0; padding:0; background:none; font:inherit; color:inherit; display:block; text-align:center;
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:28px 20px;
  box-shadow:0 1px 0 var(--line), 0 12px 30px -18px rgba(0,0,0,.35);
}
.front{background:var(--surface); border:1px solid var(--line)}
.back{background:var(--card-back); color:var(--card-back-ink); transform:rotateY(180deg)}
.tag{
  position:absolute; top:14px; left:16px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
}
.back .tag{color:var(--card-back-ink); opacity:.7}
.num{position:absolute; top:14px; right:16px; font-family:var(--mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.back .num{color:var(--card-back-ink); opacity:.7}
.hanzi{font-family:var(--serif); font-weight:900; font-size:clamp(44px,12vw,84px); line-height:1.1; letter-spacing:.04em}
.back .hanzi{font-size:clamp(32px,8vw,52px)}
.eng{font-size:clamp(20px,4.5vw,28px); font-weight:600; line-height:1.25; text-wrap:balance}
.back .eng{font-size:18px; font-weight:500; opacity:.9}
.pron{display:flex; flex-direction:column; gap:2px; font-family:var(--mono); font-size:15px}
.pron span em{font-style:normal; font-size:10px; letter-spacing:.1em; text-transform:uppercase; opacity:.65; margin-right:8px}
.note{font-size:13px; max-width:46ch; opacity:.8; text-wrap:pretty}
.hint{position:absolute; bottom:12px; font-size:12px; color:var(--muted)}

.controls{display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; align-items:center}
.nav{display:flex; gap:8px}
.btn{
  font:inherit; font-size:14px; font-weight:500; padding:9px 16px; border-radius:8px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
}
.btn.again{border-color:var(--again); color:var(--again)}
.btn.got{background:var(--good); border-color:var(--good); color:var(--surface)}
.btn:disabled{opacity:.4; cursor:default}
.progress{height:4px; background:var(--line); border-radius:4px; overflow:hidden}
.progress i{display:block; height:100%; background:var(--tile); width:0; transition:width .25s}
.keys{font-size:12px; color:var(--muted); text-align:center}
.keys kbd{font-family:var(--mono); font-size:11px; border:1px solid var(--line); border-radius:4px; padding:1px 5px; background:var(--surface)}

details{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:4px 14px}
summary{cursor:pointer; padding:10px 0; font-weight:600}
.tablewrap{overflow-x:auto; padding-bottom:10px}
table{border-collapse:collapse; width:100%; font-size:14px; min-width:520px}
th{text-align:left; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--line)}
td{padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top}
td.z{font-family:var(--serif); font-weight:900; font-size:17px; white-space:nowrap}
td.m{font-family:var(--mono); font-size:12.5px; white-space:nowrap}
.empty{padding:40px 12px; text-align:center; color:var(--muted)}
@media (prefers-reduced-motion: reduce){ .card, .progress i{transition:none} }
@media (max-width:480px){ .row .lbl{width:100%} .card{aspect-ratio:auto; height:300px} }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>飲食詞彙<small><span id="count">50</span> everyday food words · Traditional Chinese</small></h1>
    <div class="score" aria-live="polite">
      <span>Card <b id="pos">1</b>/<b id="tot">50</b></span>
      <span class="k">Got it <b id="kc">0</b></span>
      <span class="a">Again <b id="ac">0</b></span>
    </div>
  </header>

  <section class="panel" aria-label="Deck settings">
    <div class="row" id="cats"><span class="lbl">Topic</span></div>
    <div class="row" id="modes"><span class="lbl">Show first</span>
      <button class="chip" data-front="zh" aria-pressed="true">中文 Chinese</button>
      <button class="chip" data-front="en" aria-pressed="false">English</button>
    </div>
    <div class="row" id="prons"><span class="lbl">Sounds</span>
      <button class="chip" data-pron="both" aria-pressed="true">Both</button>
      <button class="chip" data-pron="jp" aria-pressed="false">Jyutping (Cantonese)</button>
      <button class="chip" data-pron="py" aria-pressed="false">Pinyin (Mandarin)</button>
    </div>
    <div class="row"><span class="lbl">Deck</span>
      <button class="chip" id="shuffle">Shuffle</button>
      <button class="chip" id="review" aria-pressed="false">Review “Again” only</button>
      <button class="chip" id="reset">Reset scores</button>
    </div>
  </section>

  <div class="progress" aria-hidden="true"><i id="bar"></i></div>

  <div class="stage" id="stage">
    <button class="card" id="card" aria-label="Flashcard, press to flip">
      <div class="face front" id="front"></div>
      <div class="face back" id="back"></div>
    </button>
  </div>

  <div class="controls">
    <div class="nav">
      <button class="btn" id="prev">← Prev</button>
      <button class="btn" id="next">Next →</button>
    </div>
    <div class="nav">
      <button class="btn" id="sayYue" title="Play Cantonese audio">▶ Cantonese</button>
      <button class="btn" id="sayCmn" title="Play Mandarin audio">▶ Mandarin</button>
    </div>
    <div class="nav">
      <button class="btn again" id="again">Again</button>
      <button class="btn got" id="got">Got it</button>
    </div>
  </div>
  <p class="keys"><kbd>Space</kbd> flip · <kbd>←</kbd><kbd>→</kbd> move · <kbd>1</kbd> again · <kbd>2</kbd> got it</p>

  <details>
    <summary>Full word list</summary>
    <div class="tablewrap"><table>
      <thead><tr><th>中文</th><th>Jyutping</th><th>Pinyin</th><th>English</th></tr></thead>
      <tbody id="list"></tbody>
    </table></div>
  </details>
</div>

<script src="words.js"></script>
<script>
const WORDS = WORD_LIST.map((w,i)=>({id:i,cat:w[0],zh:w[1],jp:w[2],py:w[3],en:w[4],note:w[5]||""}));

const CATS = ["All", ...new Set(WORDS.map(w=>w.cat))];
const S = {cat:"All", front:"zh", pron:"both", order:WORDS.map(w=>w.id), deck:[], i:0, flipped:false, review:false, marks:{}};

function load(){ try{ const m = JSON.parse(localStorage.getItem("foodcards-marks")||"{}"); if(m && typeof m==="object") S.marks=m; }catch(e){} }
function save(){ try{ localStorage.setItem("foodcards-marks", JSON.stringify(S.marks)); }catch(e){} }

const $ = id=>document.getElementById(id);
const esc = s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function buildDeck(keepId){
  S.deck = S.order.map(i=>WORDS[i]).filter(w=>(S.cat==="All"||w.cat===S.cat) && (!S.review || S.marks[w.id]==="again"));
  const k = keepId==null ? -1 : S.deck.findIndex(w=>w.id===keepId);
  S.i = k>=0 ? k : 0; S.flipped=false; render();
}
function pronHTML(w){
  const p=[];
  if(S.pron!=="py") p.push(`<span><em>粵</em>${esc(w.jp)}</span>`);
  if(S.pron!=="jp") p.push(`<span><em>普</em>${esc(w.py)}</span>`);
  return `<div class="pron">${p.join("")}</div>`;
}
function render(){
  const card=$("card"), n=S.deck.length;
  card.classList.toggle("flipped", S.flipped);
  $("tot").textContent=n; $("pos").textContent=n?S.i+1:0;
  const vals=Object.values(S.marks);
  $("kc").textContent=vals.filter(v=>v==="got").length;
  $("ac").textContent=vals.filter(v=>v==="again").length;
  $("bar").style.width = n ? ((S.i+1)/n*100)+"%" : "0";
  ["prev","next","again","got","sayYue","sayCmn"].forEach(id=>$(id).disabled=!n);
  if(!n){
    $("front").innerHTML=`<div class="empty">${S.review?"No cards marked “Again” in this topic. Nice work.":"No cards here."}</div>`;
    $("back").innerHTML=""; return;
  }
  const w=S.deck[S.i], mark=S.marks[w.id];
  const markTxt = mark==="got"?" · ✓ got it":mark==="again"?" · ↺ again":"";
  const head = `<span class="tag">${esc(w.cat)}${markTxt}</span><span class="num">${String(w.id+1).padStart(2,"0")}</span>`;
  const zhSide = `${head}<div class="hanzi" lang="zh-Hant">${esc(w.zh)}</div>`;
  const enSide = `${head}<div class="eng">${esc(w.en)}</div>`;
  const full = `${head}<div class="hanzi" lang="zh-Hant">${esc(w.zh)}</div>${pronHTML(w)}<div class="eng">${esc(w.en)}</div>${w.note?`<div class="note">${esc(w.note)}</div>`:""}`;
  $("front").innerHTML = (S.front==="zh"?zhSide:enSide) + `<span class="hint">Tap to flip</span>`;
  $("back").innerHTML = full;
  card.setAttribute("aria-label", `Card ${S.i+1} of ${n}. ${S.flipped?"Answer showing":"Press to flip"}`);
}
function go(d){ if(!S.deck.length) return; S.i=(S.i+d+S.deck.length)%S.deck.length; S.flipped=false; render(); }
function mark(v){
  if(!S.deck.length) return;
  const w=S.deck[S.i]; S.marks[w.id]=v; save();
  if(S.review && v==="got"){ const nextId = S.deck[(S.i+1)%S.deck.length].id; buildDeck(nextId===w.id?null:nextId); }
  else go(1);
}

function setPressed(groupSel, btn){ document.querySelectorAll(groupSel).forEach(b=>b.setAttribute("aria-pressed", b===btn?"true":"false")); }

const catRow=$("cats");
CATS.forEach(c=>{
  const b=document.createElement("button"); b.className="chip"; b.textContent=c; b.dataset.cat=c;
  b.setAttribute("aria-pressed", c==="All"?"true":"false");
  b.onclick=()=>{ S.cat=c; setPressed("[data-cat]",b); buildDeck(); };
  catRow.appendChild(b);
});
document.querySelectorAll("[data-front]").forEach(b=>b.onclick=()=>{ S.front=b.dataset.front; setPressed("[data-front]",b); S.flipped=false; render(); });
document.querySelectorAll("[data-pron]").forEach(b=>b.onclick=()=>{ S.pron=b.dataset.pron; setPressed("[data-pron]",b); render(); });
$("shuffle").onclick=()=>{ const a=S.order; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} buildDeck(); };
$("review").onclick=()=>{ S.review=!S.review; $("review").setAttribute("aria-pressed",S.review); buildDeck(); };
$("reset").onclick=()=>{ S.marks={}; save(); buildDeck(); };
$("card").onclick=()=>{ if(!S.deck.length) return; S.flipped=!S.flipped; render(); };
$("prev").onclick=()=>go(-1); $("next").onclick=()=>go(1);
function say(langs){
  if(!S.deck.length || !("speechSynthesis" in window)) return;
  try{
    const u=new SpeechSynthesisUtterance(S.deck[S.i].zh);
    const vs=speechSynthesis.getVoices();
    const v=vs.find(x=>langs.some(l=>x.lang.toLowerCase().replace("_","-").startsWith(l)));
    u.lang=langs[0]; if(v) u.voice=v; u.rate=.8;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}
$("sayYue").onclick=()=>say(["zh-hk","yue"]);
$("sayCmn").onclick=()=>say(["zh-tw","zh-cn","cmn","zh"]);
$("again").onclick=()=>mark("again"); $("got").onclick=()=>mark("got");
document.addEventListener("keydown",e=>{
  if(e.target.closest("summary")) return;
  if(e.key==="ArrowRight") go(1);
  else if(e.key==="ArrowLeft") go(-1);
  else if(e.key===" " && e.target.id!=="card" && !e.target.closest("button")){ e.preventDefault(); $("card").click(); }
  else if(e.key==="1") mark("again");
  else if(e.key==="2") mark("got");
});

$("list").innerHTML = WORDS.map(w=>`<tr><td class="z" lang="zh-Hant">${esc(w.zh)}</td><td class="m">${esc(w.jp)}</td><td class="m">${esc(w.py)}</td><td>${esc(w.en)}</td></tr>`).join("");

$("count").textContent = WORDS.length;
load(); buildDeck();
</script>
</body>
</html>
